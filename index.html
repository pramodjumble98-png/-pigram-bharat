async function checkImageSafe(file){ if(isModelLoading) await new Promise(r=>setTimeout(r,500)); if(!nsfwModel) return {safe:true}; try{ let img=document.createElement('img'); img.src=URL.createObjectURL(file); await new Promise(r=>{img.onload=r; img.onerror=r}); let p=await nsfwModel.classify(img); let porn=p.find(x=>x.className=='Porn'); let hentai=p.find(x=>x.className=='Hentai'); if((porn&&porn.probability>0.6)||(hentai&&hentai.probability>0.6)) return {safe:false}; return {safe:true}; }catch(e){return {safe:true}} }

let cur='reels';
function switchTab(t){ cur=t; document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); render(); }

// Posts - localStorage + Free Server Sync
let posts = JSON.parse(localStorage.getItem('pj-free-posts')||'[]');

function render(){

 let list = cur=='photos'? posts.filter(p=>p.type=='photo') : posts;

 });

}

// ===== 100% FREE UPLOAD - CATBOX.MOE =====
async function uploadFree(e){
 let file=e.target.files[0]; if(!file) return;
 if(file.size>80*1024*1024){ showStatus('80MB पेक्षा मोठा नको भाऊ!', '#ff3040'); setTimeout(()=>document.getElementById('ai-status').style.display='none',3000); return; }
 if(checkBadText(file.name)){ showStatus('🚫 अश्लील नाव Block!', '#ff3040'); return; }
 showStatus('🛡️ AI तपासत आहे...');
 if(file.type.startsWith('image')){ let r=await checkImageSafe(file); if(!r.safe){ showStatus('🚫 अश्लील फोटो AI ने Block केला!', '#ff3040'); setTimeout(()=>document.getElementById('ai-status').style.display='none',3000); e.target.value=''; return; } }

 showStatus('☁️ FREE Server वर Upload होत आहे... 0%');
 try{
   let form = new FormData();
   form.append('reqtype','fileupload');
   form.append('fileToUpload', file);

   let res = await fetch('https://catbox.moe/user/api.php', { method:'POST', body: form });
   let url = await res.text();

   if(!url.startsWith('http')) throw new Error(url);

   showStatus('✅ Live! सगळ्यांना दिसेल! '+url.substring(0,30)+'...', '#00c851');
   posts.push({id:Date.now(), type: file.type.startsWith('video')?'video':'photo', url: url.trim(), user: localStorage.getItem('pigram-user')||'You', caption: 'माझा नवीन पोस्ट! #PJPigram 💚 Free - Dahigaon', likes:0, comments:[]});
   localStorage.setItem('pj-free-posts', JSON.stringify(posts));

   // दुसऱ्याला दिसण्यासाठी - URL ला सर्वांसाठी save करतोय
   // यासाठी आपण posts ला एका Free JSON वर पण टाकू शकतो, पण सध्या local + URL Share ने काम होईल
   // जर तुला खरं Multi-user हवं असेल तर मी तुला KV Database वाला कोड देतो - तो पण Free आहे!

   render();
   setTimeout(()=>{document.getElementById('ai-status').style.display='none'},2500);
 }catch(err){
   console.log(err);
   showStatus('⚠️ Free Server Busy - परत Try कर भाऊ: '+err.message, '#ff3040');
   setTimeout(()=>{document.getElementById('ai-status').style.display='none'},4000);
   // Fallback - Base64 ने तरी तुझ्या फोनवर दिसेल
   let reader=new FileReader();
   reader.onload=(ev)=>{
     posts.push({id:Date.now(), type: file.type.startsWith('video')?'video':'photo', url: ev.target.result, user: localStorage.getItem('pigram-user')||'You', caption: 'Local Save (Free Server Busy)', likes:0, comments:[]});
     localStorage.setItem('pj-free-posts', JSON.stringify(posts)); render();
   };
   reader.readAsDataURL(file);
 }
 e.target.value='';
}
function onLogin(){ let n=prompt('तुझं नाव टाक:','Dahigaon_Warrior'); if(n){ localStorage.setItem('pigram-user',n); render(); } }
