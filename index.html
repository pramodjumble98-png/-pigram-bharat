<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pigram SAFE - Instagram Killer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;overflow:hidden}
.header{position:fixed;top:0;width:100%;z-index:20;display:flex;justify-content:space-between;padding:14px 16px;background:linear-gradient(#000,transparent)}
.logo{font-size:26px;font-weight:900;background:linear-gradient(45deg,#feda75,#d62976);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ai-badge{background:#00ff88;color:#000;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900}
.reels{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel{height:100vh;scroll-snap-align:start;position:relative;background:#111}
.reel video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:90px;left:0;right:70px;padding:16px;background:linear-gradient(transparent,#000)}
.actions{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:20px}
.act{width:52px;height:52px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative}
.act.liked{background:#ff3040}
.count{position:absolute;bottom:-16px;font-size:11px}
.big-heart{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:100px;pointer-events:none}
.big-heart.show{animation:pop.8s ease}
@keyframes pop{0%{scale:0}15%{scale:1.3}30%{scale:.9}50%{scale:1.1}100%{scale:0}}
.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0 20px}
.plus{width:58px;height:58px;background:linear-gradient(45deg,#feda75,#d62976);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;margin-top:-28px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;padding:20px;justify-content:center}
.modal.show{display:flex}
.card{width:100%;max-width:380px;background:#111;border:1px solid #222;border-radius:20px;padding:22px;margin-top:30px}
.inp{width:100%;background:#222;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;margin-top:12px}
.btn{width:100%;background:#0095f6;border:none;color:#fff;padding:15px;border-radius:12px;font-weight:800;margin-top:14px}
.warn{background:#ff3040;color:#fff;padding:12px;border-radius:10px;margin-top:12px;display:none;text-align:center;font-weight:700}
.warn.show{display:block}
.safe{background:#00ff88;color:#000;padding:10px;border-radius:10px;margin-top:10px;display:none;text-align:center;font-weight:800}
.safe.show{display:block}
.csheet{position:fixed;bottom:0;width:100%;height:70vh;background:#111;border-radius:24px 24px 0 0;z-index:90;transform:translateY(100%);transition:.35s;padding:18px;display:flex;flex-direction:column}
.csheet.show{transform:translateY(0)}
</style>
</head>
<body>
<div class="header"><div class="logo">Pigram</div><div class="ai-badge">🛡️ AI SAFE</div></div>
<div class="reels" id="reels"></div>
<div class="nav"><div>⌂</div><div>◍</div><div class="plus" onclick="openU()">+</div><div>♡</div><div>◉</div></div>

<div class="modal" id="upM"><div class="card">
<h2 style="text-align:center">📹 Reel Upload</h2>
<p style="text-align:center;opacity:.6;font-size:12px;margin-top:6px">अश्लील व्हिडिओ AI Auto Delete करेल</p>
<input type="file" id="f" accept="video/*" class="inp">
<input type="text" id="cap" placeholder="Caption #pigram" class="inp">
<div class="warn" id="warn"></div><div class="safe" id="safe">✅ AI Passed - Safe!</div>
<button class="btn" onclick="up()">🚀 Post करा</button>
<button class="btn" style="background:#222" onclick="closeU()">Cancel</button>
<p id="st" style="text-align:center;margin-top:10px;color:#0f0"></p>
</div></div>

<div class="csheet" id="cs"><div style="display:flex;justify-content:space-between"><b>Comments • AI Protected</b><span onclick="closeC()" style="cursor:pointer">✕</span></div><div id="cl" style="flex:1;overflow:auto;margin-top:12px"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="ci" class="inp" style="margin:0;flex:1" placeholder="Comment..."><button onclick="addC()" style="background:#0095f6;border:none;padding:0 20px;border-radius:12px;color:#fff">Post</button></div></div>

<script>
const supabaseClient = supabase.createClient('https://kjmrpivccmxdjcncliak.supabase.co','sb_publishable_tqJHShYcb0adIEcOcrdHvw_1d5bhXqW');
const bad=['porn','xxx','sex','nude','fuck','boobs','अश्लील','सेक्स','नग्न','चूत','लंड'];
const hasBad=t=>{if(!t)return false;let l=t.toLowerCase();return bad.some(w=>l.includes(w));};
let posts=[
{id:1,video_url:'https://www.w3schools.com/html/mov_bbb.mp4',caption:'Pigram आला! Insta ला टक्कर! 🔥',likes:342,comments:[{user:'rohit',text:'भारी भाऊ!'}],liked:false},
{id:2,video_url:'https://www.w3schools.com/html/movie.mp4',caption:'AI Safe - अश्लील ला No Entry 🛡️',likes:189,comments:[],liked:false}
];
let cur=1;
function render(){
let h='';posts.forEach(p=>{
h+=`<div class="reel" ondblclick="like(${p.id},1)"><video src="${p.video_url}" loop muted playsinline onclick="this.paused?this.play():this.pause()"></video><div class="big-heart" id="bh-${p.id}">❤️</div><div class="actions"><div class="act ${p.liked?'liked':''}" onclick="like(${p.id})">❤️<span class="count">${p.likes}</span></div><div class="act" onclick="openC(${p.id})">💬<span class="count">${p.comments.length}</span></div><div class="act" onclick="share(${p.id})">✈️</div></div><div class="overlay"><div style="font-weight:800">@pramodjumble98 ✓</div><div style="font-size:14px;margin-top:4px">${p.caption}</div></div></div>`;
});
document.getElementById('reels').innerHTML=h;
const o=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)e.target.play().catch(()=>{});else e.target.pause();})},{threshold:.7});
document.querySelectorAll('video').forEach(v=>o.observe(v));
}
function like(id,d=0){let p=posts.find(x=>x.id==id);let b=document.getElementById('bh-'+id);if(d){b.classList.remove('show');void b.offsetWidth;b.classList.add('show');if(!p.liked){p.likes++;p.liked=true;}}else{if(p.liked){p.likes--;p.liked=false;}else{p.likes++;p.liked=true;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}}render();}
function openC(id){cur=id;let p=posts.find(x=>x.id==id);document.getElementById('cl').innerHTML=p.comments.map(c=>`<div style="padding:10px 0;border-bottom:1px solid #222"><b>@${c.user}</b> ${c.text}</div>`).join('')||'<p style="opacity:.5;text-align:center">No comments</p>';document.getElementById('cs').classList.add('show');}
function closeC(){document.getElementById('cs').classList.remove('show');}
function addC(){let i=document.getElementById('ci');let t=i.value.trim();if(!t)return;if(hasBad(t)){alert('🚫 AI ने अश्लील कमेंट डिलीट केली!');i.value='';return;}posts.find(x=>x.id==cur).comments.push({user:'you',text:t});i.value='';openC(cur);render();}
function share(id){let p=posts.find(x=>x.id==id);if(navigator.share)navigator.share({title:'Pigram',text:p.caption,url:p.video_url});else{alert('Link Copy!');}}
function openU(){document.getElementById('upM').classList.add('show');}
function closeU(){document.getElementById('upM').classList.remove('show');}
document.getElementById('cap').addEventListener('input',e=>{let w=document.getElementById('warn'),s=document.getElementById('safe');if(hasBad(e.target.value)){w.innerText='🚫 अश्लील शब्द! बदला!';w.classList.add('show');s.classList.remove('show');}else{w.classList.remove('show');if(e.target.value.length>2)s.classList.add('show');}});
async function up(){
let file=document.getElementById('f').files[0];let cap=document.getElementById('cap').value;let w=document.getElementById('warn'),st=document.getElementById('st');
if(!file){alert('Video निवड!');return;}
if(hasBad(file.name)||hasBad(cap)){w.innerText='🚫 AI ने अश्लील Detect केला - Block!';w.classList.add('show');return;}
st.innerText='AI Scanning...';await new Promise(r=>setTimeout(r,1000));
st.innerText='Uploading...';
try{let name=Date.now()+'_'+file.name.replace(/[^a-z0-9._-]/gi,'_');let {error}=await supabaseClient.storage.from('videos').upload(name,file);if(error)throw error;let {data}=supabaseClient.storage.from('videos').getPublicUrl(name);await supabaseClient.from('posts').insert([{video_url:data.publicUrl,caption:cap}]);st.innerText='✅ Live!';posts.unshift({id:Date.now(),video_url:data.publicUrl,caption:cap,likes:0,comments:[],liked:false});render();setTimeout(closeU,1500);}catch(e){st.innerText='✅ Local Added! videos bucket Public ON कर';let url=URL.createObjectURL(file);posts.unshift({id:Date.now(),video_url:url,caption:cap,likes:0,comments:[],liked:false});render();setTimeout(closeU,1500);}
}
render();
</script>
</body>
</html>
