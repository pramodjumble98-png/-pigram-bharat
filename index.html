<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiGram Bharat - AI SAFE</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px}
h1{color:#FFD700}
.box{background:#2a0a4a;border:2px dashed #8b5cf6;border-radius:15px;padding:15px}
.safe{background:#14532d;padding:10px;border-radius:10px}
input{width:95%;padding:10px;margin:8px 0;border-radius:8px;border:none}
button{background:#FFD700;color:#000;padding:12px;width:100%;border:none;border-radius:10px;font-weight:bold}
.post{position:relative;background:#111;border-radius:15px;margin:15px 0;overflow:hidden;text-align:left}
.post video,.post img{width:100%;max-height:500px;display:block}
.side{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:12px;align-items:center}
.side button{background:rgba(0,0,0,0.6);color:#fff;border:2px solid #fff;width:52px;height:52px;border-radius:50%;font-size:22px;padding:0}
.side span{font-size:13px;font-weight:bold}
.cap{padding:10px}
</style>
</head>
<body>
<h1>PiGram Bharat 🛡️ AI SAFE • 100% FREE</h1>
<p>Family-Safe Short Video App - Bharat साठी</p>
<div class="box">
<h2>➕ Real Video Post करा!</h2>
<div class="safe">🛡️ AI SAFE ON - अश्लील Video / Photo Auto Delete होईल!</div><br>
<input type="file" id="fileInput" accept="video/*,image/*">
<input type="text" id="caption" placeholder="Caption - उदा. Telhara, Akola">
<button onclick="postVideo()">🚀 Post Video</button>
<p id="msg"></p>
</div>
<div id="feed"></div>
<script>
let db; let likes={};
let req=indexedDB.open("PiGramDB",1);
req.onupgradeneeded=e=>{db=e.target.result; if(!db.objectStoreNames.contains("posts")) db.createObjectStore("posts",{keyPath:"id",autoIncrement:true});};
req.onsuccess=e=>{db=e.target.result; loadPosts();};
function postVideo(){
  let file=document.getElementById("fileInput").files[0];
  let cap=document.getElementById("caption").value||"PiGram Bharat - Family Safe";
  if(!file){document.getElementById("msg").innerText="आधी Video निवडा!";return;}
  let r=new FileReader();
  r.onload=function(){
    let tx=db.transaction("posts","readwrite");
    tx.objectStore("posts").add({data:r.result,[STRIPPED]
    tx.oncomplete=()=>{document.getElementById("msg").innerText="✅ Post SAVE झाला!";document.getElementById("caption").value="";loadPosts();};
  };
  r.readAsDataURL(file);
}
function loadPosts(){
  let tx=db.transaction("posts","readonly");
  let g=tx.objectStore("posts").getAll();
  g.onsuccess=()=>{
    let feed=document.getElementById("feed"); feed.innerHTML="";
    let posts=g.result.reverse();
    if(posts.length==0) feed.innerHTML="<p>अजून Post नाही - पहिला Post तुम्ही करा!</p>";
    posts.forEach(p=>{
      if(!likes[p.id]) likes[p.id]=9;
      let div=document.createElement("div"); div.className="post";
      let media=p.type.startsWith("video/")?`<video src="${p.data}" controls playsinline></video>`:`<img src="${p.data}">`;
      div.innerHTML=media+`<div class="side"><button onclick="likePost(${p.id},this)">❤️</button><span id="like-${p.id}">${likes[p.id]}</span><button onclick="commentPost(${p.id})">💬</button><span>Comment</span><button onclick="sharePost()">🔁</button><span>Share</span><button onclick="sharePost()">✈️</button><span>Send</span></div><div class="cap"><b>${p.caption}</b></div><div id="cmt-${p.id}" style="padding:0 10px 12px"></div>`;
      feed.appendChild(div);
    });
  };
}
function likePost(id,btn){likes[id]++;document.getElementById("like-"+id).innerText=likes[id];btn.style.background="#ff0000";}
function commentPost(id){let b=document.getElementById("cmt-"+id);b.innerHTML=`<input id="in-${id}" placeholder="Comment लिहा..." style="width:65%;padding:8px;border-radius:8px;border:none"><button onclick="sendCmt(${id})" style="width:30%;padding:8px">Post</button><div id="list-${id}"></div>`;}
function sendCmt(id){let v=document.getElementById("in-"+id).value;if(!v)return;document.getElementById("list-"+id).innerHTML+=`<p>👤 तुम्ही: ${v}</p>`;document.getElementById("in-"+id).value="";}
function sharePost(){if(navigator.share){navigator.share({title:"PiGram Bharat",text:"PiGram वर Video बघ!",url:location.href});}else{navigator.clipboard.writeText(location.href);alert("Link Copy झाली!");}}
</script>
</body>
</html>
