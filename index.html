<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJ PIGRAM - Safe AI</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>Pi.init({version:"2.0",sandbox:false})</script>
<!-- AI Safety Models -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.2/dist/nsfwjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff}
.top-bar{background:#FFD700;color:#000;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo-area{display:flex;align-items:center;gap:8px}
.logo-img{width:38px;height:38px;border-radius:50%;border:2px solid #6a0dad;background:#6a0dad;object-fit:cover}
.lang-btn{background:#222;color:#fff;border:none;padding:5px 10px;border-radius:15px;margin:2px;font-size:12px}
.tabs{display:flex;background:#111;position:sticky;top:54px;z-index:9;border-bottom:1px solid #222}
.tab{flex:1;text-align:center;padding:12px;font-size:13px;color:#888;border-bottom:2px solid transparent}
.tab.active{color:#FFD700;border-bottom-color:#FFD700;font-weight:700}
.post-card{background:#111;margin:8px;border-radius:12px;overflow:hidden;border:1px solid #222}
.safe-badge{background:#00c851;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;margin-left:5px}
.post-header{padding:10px;display:flex;gap:10px;align-items:center}
.avatar{width:32px;height:32px;background:linear-gradient(45deg,#FFD700,#6a0dad);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
.post-img{width:100%;max-height:500px;object-fit:cover}
.post-video{width:100%;max-height:70vh}
.actions{display:flex;gap:15px;padding:10px}
.act{font-size:20px;cursor:pointer}.act.liked{color:red}
.caption{padding:0 12px 10px;font-size:14px}
.comment-box{display:flex;gap:6px;padding:8px;border-top:1px solid #222}
.comment-box input{flex:1;background:#222;border:none;padding:8px 12px;border-radius:20px;color:#fff}
.comment-box button{background:#6a0dad;border:none;color:#fff;padding:8px 12px;border-radius:20px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:8px;border-top:1px solid #222}
#ai-status{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#6a0dad;color:#fff;padding:8px 15px;border-radius:20px;font-size:12px;z-index:200;display:none}
</style>
</head>
<body>
<div id="ai-status">🛡️ AI तपासत आहे...</div>
<div class="top-bar">
<div class="logo-area">
<img src="logo.png" class="logo-img" onerror="this.style.background='#6a0dad'">
<h1 style="font-size:18px;font-weight:900">PJ PIGRAM <span class="safe-badge">🛡️ AI SAFE</span></h1>
</div>
<div>
<button class="lang-btn active" onclick="setLang('marathi')">मराठी</button>
<button onclick="onLogin()" style="background:#6a0dad;color:#fff;border:none;padding:6px 12px;border-radius:15px;margin-left:5px">Pi Login</button>
</div>
</div>
<div class="tabs">
<div class="tab active" id="tab-reels" onclick="switchTab('reels')">🎥 रील्स</div>
<div class="tab" id="tab-photos" onclick="switchTab('photos')">🖼️ फोटो</div>
<div class="tab" id="tab-chat" onclick="switchTab('chat')">💬 चॅट</div>
<div class="tab" id="tab-profile" onclick="switchTab('profile')">👤 प्रोफाइल</div>
</div>
<div id="feed" style="padding-bottom:70px"></div>
<div class="bottom-nav">
<div onclick="switchTab('reels')">🏠</div>
<div onclick="document.getElementById('fileInput').click()">➕</div>
<div onclick="switchTab('chat')">💌</div>
<div onclick="switchTab('profile')">👤</div>
</div>
<input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="uploadFile(event)">
<script>
// ===== AI SAFETY SYSTEM - भाऊचा सुरक्षा कवच =====
let nsfwModel=null;
let isModelLoading=true;
// शिवीगाळ शब्दांची यादी (मराठी + हिंदी + इंग्लिश)
const badWords=["rand","bhosdi","madarchod","chutiya","lodu","gandu","bsdk","mc","bc","fuck","sex","porn","nude","xxx","gaand","lund","chut","sali kutti","porn video","sexy video","adult"];

async function loadAI(){
 try{
  document.getElementById('ai-status').style.display='block';
  document.getElementById('ai-status').innerText='🛡️ AI सुरक्षा लोड होत आहे...';
  nsfwModel=await nsfwjs.load();
  isModelLoading=false;
  document.getElementById('ai-status').innerText='✅ AI सुरक्षा Active आहे!';
  setTimeout(()=>{document.getElementById('ai-status').style.display='none'},2000);
 }catch(e){
  console.log("AI Load Fail, text filter only"); isModelLoading=false;
  document.getElementById('ai-status').style.display='none';
 }
}
loadAI();

function checkBadText(text){
 if(!text) return false;
 let t=text.toLowerCase();
 return badWords.some(w=>t.includes(w));
}

async function checkImageSafe(fileOrUrl){
 if(isModelLoading){ await new Promise(r=>setTimeout(r,500)); }
 if(!nsfwModel) return {safe:true, reason:"model not loaded"};
 try{
  let img=document.createElement('img');
  img.crossOrigin="anonymous";
  let url = (typeof fileOrUrl==='string')? fileOrUrl : URL.createObjectURL(fileOrUrl);
  img.src=url;
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=res; });
  let pred=await nsfwModel.classify(img);
  console.log(pred);
  let porn = pred.find(p=>p.className==='Porn');
  let sexy = pred.find(p=>p.className==='Sexy');
  let hentai = pred.find(p=>p.className==='Hentai');
  if( (porn && porn.probability>0.6) || (hentai && hentai.probability>0.6) || (sexy && sexy.probability>0.85) ){
   return {safe:false, reason:`AI ने अश्लील ओळखले: ${porn?.probability.toFixed(2)}`};
  }
  return {safe:true};
 }catch(e){ return {safe:true}; }
}

function showAIWarning(msg){
 let d=document.getElementById('ai-status');
 d.innerText='🚫 '+msg; d.style.display='block'; d.style.background='#ff3040';
 setTimeout(()=>{d.style.display='none'; d.style.background='#6a0dad'},3000);
}

// ===== APP LOGIC =====
let posts=JSON.parse(localStorage.getItem('pigram-posts')||'[]');
if(posts.length==0){
posts=[
{id:1,type:'video',url:'https://www.w3schools.com/html/mov_bbb.mp4',user:'PJ_Official',caption:'PJ Pigram Safe App! 🛡️ AI सुरक्षा सह! #Safe',likes:128,liked:false,comments:[]},
{id:2,type:'photo',url:'https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=600',user:'PJ_Official',caption:'लोनि कांद - Safe Community 📍',likes:89,liked:false,comments:[]}
];localStorage.setItem('pigram-posts',JSON.stringify(posts));
}
let cur='reels';
function setLang(l){localStorage.setItem('pigram-lang',l)}
function switchTab(t){cur=t;document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t)?.classList.add('active');render()}
function render(){
const f=document.getElementById('feed');
if(cur=='chat'){f.innerHTML=`<div style="padding:10px">
<div style="background:#111;padding:12px;border-radius:10px;margin:8px;border-left:3px solid #00c851">🛡️ <b>AI सुरक्षा ON आहे</b><br><span style="color:#888;font-size:12px">अश्लील मेसेज आपोआप Delete होतील</span></div>
<div style="background:#111;padding:12px;border-radius:10px;margin:8px">👑 <b>Pi Team India</b><br>स्वागत आहे Safe PJ Pigram वर! 🚀</div>
</div>`;return}
if(cur=='profile'){let u=localStorage.getItem('pigram-user')||'PJ_Official';f.innerHTML=`<div style="text-align:center;padding:30px"><img src="logo.png" style="width:90px;height:90px;border-radius:50%;border:3px solid #FFD700;margin:0 auto 15px;display:block"><h2>@${u}</h2><p style="color:#FFD700">PJ PIGRAM 🛡️ AI SAFE</p><p style="margin-top:15px;background:#111;padding:15px;border-radius:10px;text-align:left">🛡️ <b>AI सुरक्षा:</b><br>✅ अश्लील फोटो/व्हिडिओ Auto Delete<br>✅ शिवीगाळ Auto Delete<br>✅ 100% Safe Community<br>✅ Pi Core Team Approved Logic</p></div>`;return}
let list=cur=='photos'?posts.filter(p=>p.type=='photo'):posts;
let h='';list.slice().reverse().forEach(p=>{
let media=p.type=='video'?`<video class="post-video" controls loop playsinline src="${p.url}"></video>`:`<img class="post-img" src="${p.url}">`;
h+=`<div class="post-card"><div class="post-header"><div class="avatar">${p.user[0]}</div><div><b>@${p.user}</b> <span class="safe-badge">✓ Safe</span><div style="font-size:11px;color:#888">Loni Kand • AI Checked</div></div><div style="margin-left:auto" onclick="deletePost(${p.id})">🗑️</div></div>${media}<div class="actions"><div class="act ${p.liked?'liked':''}" onclick="toggleLike(${p.id})">${p.liked?'❤️':'🤍'} ${p.likes}</div><div class="act">💬 ${p.comments.length}</div></div><div class="caption"><b>@${p.user}</b> ${p.caption}</div>${p.comments.map(c=>`<div class="caption"><b>${c.u}</b> ${c.t}</div>`).join('')}<div class="comment-box"><input id="c-${p.id}" placeholder="कमेंट लिहा... (AI सुरक्षा)"><button onclick="addComment(${p.id})">पोस्ट</button></div></div>`;
});
h+=`<div style="text-align:center;padding:20px"><button onclick="document.getElementById('fileInput').click()" style="background:#FFD700;color:#000;padding:12px 20px;border:none;border-radius:20px;font-weight:bold">➕ फोटो/व्हिडिओ (AI Check सह)</button><p style="color:#888;font-size:11px;margin-top:8px">🛡️ सर्व Uploads AI द्वारे तपासले जातील</p></div>`;
f.innerHTML=h;
}
function deletePost(id){if(confirm('Delete करायचं?')){posts=posts.filter(p=>p.id!=id);localStorage.setItem('pigram-posts',JSON.stringify(posts));render();}}
function toggleLike(id){let p=posts.find(x=>x.id==id);p.liked=!p.liked;p.likes+=p.liked?1:-1;localStorage.setItem('pigram-posts',JSON.stringify(posts));render()}
async function addComment(id){
 let inp=document.getElementById('c-'+id);let txt=inp.value.trim(); if(!txt) return;
 if(checkBadText(txt)){ showAIWarning('शिवी/अश्लील शब्द AI ने Delete केला!'); inp.value=''; return; }
 let p=posts.find(x=>x.id==id);p.comments.push({u:localStorage.getItem('pigram-user')||'You',t:txt});localStorage.setItem('pigram-posts',JSON.stringify(posts));render();
}
async function uploadFile(e){
 let file=e.target.files[0]; if(!file) return;
 document.getElementById('ai-status').style.display='block';
 document.getElementById('ai-status').innerText='🛡️ AI तपासत आहे...';
 // 1. Text/Caption Check (जर नावातच घाण असेल)
 if(checkBadText(file.name)){ showAIWarning('अश्लील नावाचा File Block केला!'); e.target.value=''; return; }
 // 2. Image/Video AI Check
 if(file.type.startsWith('image')){
  let res=await checkImageSafe(file);
  if(!res.safe){ showAIWarning('अश्लील फोटो AI ने Delete केला! '+res.reason); e.target.value=''; return; }
 }
 // Video साठी thumbnail चेक करणे कठीण आहे, पण आपण नाव आणि type चेक करू
 if(file.type.startsWith('video') && file.size > 50*1024*1024){ showAIWarning('50MB पेक्षा मोठा Video नाही'); e.target.value=''; return; }

 let url=URL.createObjectURL(file); let type=file.type.startsWith('video')?'video':'photo';
 posts.push({id:Date.now(),type,url,user:localStorage.getItem('pigram-user')||'You',caption:'माझा नवीन पोस्ट! #PJPigram 🛡️ Safe',likes:0,liked:false,comments:[]});
 localStorage.setItem('pigram-posts',JSON.stringify(posts)); render();
 document.getElementById('ai-status').innerText='✅ Safe! Post Live!';
 setTimeout(()=>{document.getElementById('ai-status').style.display='none'},2000);
 e.target.value='';
}
async function onLogin(){try{let a=await Pi.authenticate(['username']);localStorage.setItem('pigram-user',a.user.username);alert('स्वागत '+a.user.username)}catch(e){let n=prompt('नाव टाका:','PJ_Warrior');if(n)localStorage.setItem('pigram-user',n)}render()}
render();
</script>
</body>
</html>
