<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiGram Bharat</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px}
h1{color:#FFD700} .box{background:#2a0a4a;border:2px dashed #8b5cf6;border-radius:15px;padding:15px}
input{width:95%;padding:12px;margin:8px 0;border-radius:10px;border:none}
button{background:#FFD700;color:#000;padding:13px;width:100%;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin-top:8px}
.post{background:#111;border-radius:15px;margin:15px 0;overflow:hidden;text-align:left}
.post video,.post img{width:100%;max-height:500px}
.cap{padding:10px}
</style>
</head>
<body>
<h1>PiGram Bharat 🛡️</h1>
<p>AI SAFE • 100% FREE • Family-Safe</p>
<p style="color:#7CFC00">✅ App चालू आहे - Key ची गरज नाही!</p>
<div class="box">
<h2>➕ नवीन Post करा</h2>
<input type="file" id="fileInput" accept="video/*,image/*">
<input type="text" id="caption" placeholder="Caption लिहा">
<button onclick="postVideo()">🚀 Post करा</button>
<p id="msg" style="color:yellow"></p>
</div>
<div id="feed"><p>अजून Post नाही - पहिला Post तुम्ही करा!</p></div>
<script>
let posts=[];
function postVideo(){
  let file=document.getElementById("fileInput").files[0];
  let cap=document.getElementById("caption").value || "PiGram Bharat";
  if(!file){ document.getElementById("msg").innerText="आधी Video निवडा!"; return; }
  document.getElementById("msg").innerText="⏳ थोडं थांबा...";
  let r=new FileReader();
  r.onload=function(){
    posts.unshift({data:r.result,[STRIPPED]
    showPosts();
    document.getElementById("msg").innerText="✅ Post झाला!";
    document.getElementById("caption").value="";
  };
  r.readAsDataURL(file);
}
function showPosts(){
  let feed=document.getElementById("feed"); feed.innerHTML="";
  posts.forEach(function(p){
    let div=document.createElement("div"); div.className="post";
    let media=p.type.indexOf("video")!==-1?'<video src="'+p.data+'" controls playsinline></video>':'<img src="'+p.data+'">';
    div.innerHTML=media+'<div class="cap"><b>'+p.caption+'</b><br>❤️ Like | 💬 Comment | 🔁 Share</div>';
    feed.appendChild(div);
  });
}
</script>
</body>
</html>
