<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiGram Bharat - AI SAFE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px}
h1{color:#FFD700}
.box{background:#2a0a4a;border:2px dashed #8b5cf6;border-radius:15px;padding:15px}
.safe{background:#14532d;padding:10px;border-radius:10px}
input{width:95%;padding:10px;margin:8px 0;border-radius:8px;border:none}
button{background:#FFD700;color:#000;padding:12px;width:100%;border:none;border-radius:10px;font-weight:bold}
.post{background:#111;border-radius:15px;margin:15px 0;overflow:hidden;text-align:left}
.post video,.post img{width:100%;max-height:500px;display:block}
.cap{padding:10px}
</style>
</head>
<body>
<h1>PiGram Bharat 🛡️ AI SAFE • 100% FREE</h1>
<p>Family-Safe Short Video App - Bharat साठी</p>
<div class="box">
<h2>➕ Real Video Post करा!</h2>
<div class="safe">🛡️ AI SAFE ON</div><br>
<input type="file" id="fileInput" accept="video/*,image/*">
<input type="text" id="caption" placeholder="Caption - उदा. Telhara, Akola">
<button onclick="postVideo()">🚀 Post Video - सर्वांना दिसेल!</button>
<p id="msg" style="color:yellow"></p>
<p id="mode" style="color:#aaa;font-size:13px">Starting...</p>
</div>
<div id="feed"></div>
<script>
const SUPABASE_URL = "PASTE_TUZI_URL_HERE";"https://kjmrpivccmxdjcncliak.supabase.co"
const SUPABASE_KEY = "PASTE_TUZI_KEY_HERE";sb_publishable_tqJHShYcb0adIEcOcrdHvw_1d5bhXqW
document.getElementById("mode").innerText = "URL: " + SUPABASE_URL.substring(0,30) + " | Key लांबी: " + SUPABASE_KEY.length;
let supa = null;
try{
  if(SUPABASE_URL.indexOf("supabase.co")!==-1 && SUPABASE_KEY.length>50){
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    document.getElementById("mode").innerText = "✅ Supabase जोडलंय - Loading Posts...";
  } else {
    document.getElementById("mode").innerText = "❌ URL / Key चुकलीय - GitHub मध्ये PASTE_TUZI_ बदललं का चेक करा - Key लांबी: " + SUPABASE_KEY.length;
    document.getElementById("feed").innerHTML = "<p>❌ URL / Key टाकली नाही - GitHub मध्ये PASTE_TUZI_URL आणि PASTE_TUZI_KEY बदला!</p>";
  }
}catch(e){
  document.getElementById("feed").innerHTML = "Error: " + e.message;
}
async function postVideo(){
  if(!supa){ document.getElementById("msg").innerText="❌ Supabase जोडलं नाही - आधी URL/Key टाका!"; return; }
  let file=document.getElementById("fileInput").files[0];
  let cap=document.getElementById("caption").value || "PiGram Bharat - Family Safe";
  if(!file){ document.getElementById("msg").innerText="आधी Photo / Video निवडा!"; return; }
  document.getElementById("msg").innerText="Upload होतंय...";
  let fileName=Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9.]/g,"");
  let up=await supa.storage.from("videos").upload(fileName,file);
  if(up.error){ document.getElementById("msg").innerText="Upload Error: "+up.error.message; return; }
  let pub=supa.storage.from("videos").getPublicUrl(fileName);
  let ins=await supa.from("posts").insert([{caption:cap,image_url:pub.data.publicUrl,media_type:file.type}]);
  if(ins.error){ document.getElementById("msg").innerText="Save Error: "+ins.error.message; return; }
  document.getElementById("msg").innerText="✅ Post झाला! सर्वांना दिसेल!";
  document.getElementById("caption").value=""; loadPosts();
}
async function loadPosts(){
  if(!supa) return;
  let res=await supa.from("posts").select("*").order("id",{ascending:false}).limit(20);
  let feed=document.getElementById("feed");
  if(res.error){ feed.innerHTML="<p>❌ Load Error: "+res.error.message+"</p>"; document.getElementById("mode").innerText="❌ Load Error - Table / Policy चेक करा"; return; }
  document.getElementById("mode").innerText="🌍 सर्वांना दिसतंय - Supabase ON - Posts: "+res.data.length;
  if(res.data.length===0){ feed.innerHTML="<p>अजून Post नाही - पहिला Post तुम्ही करा!</p>"; return; }
  feed.innerHTML="";
  res.data.forEach(function(p){
    let div=document.createElement("div"); div.className="post";
    let media=(p.media_type && p.media_type.indexOf("video")!==-1)?'<video src="'+p.image_url+'" controls playsinline></video>':'<img src="'+p.image_url+'">';
    div.innerHTML=media+'<div class="cap"><b>'+p.caption+'</b><br>❤️ Like | 💬 Comment | 🔁 Share</div>';
    feed.appendChild(div);
  });
}
if(supa) loadPosts();
</script>
</body>
</html>
