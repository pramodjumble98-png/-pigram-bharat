<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiGram Bharat - AI SAFE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px;text-align:center}
h1{color:#FFD700}
.box{background:#2a0a4a;border:2px dashed #8b5cf6;border-radius:15px;padding:15px}
.safe{background:#14532d;padding:10px;border-radius:10px}
input{width:95%;padding:10px;margin:8px 0;border-radius:8px;border:none}
button{background:#FFD700;color:#000;padding:12px;width:100%;border:none;border-radius:10px;font-weight:bold}
.post{position:relative;background:#111;border-radius:15px;margin:15px 0;overflow:hidden;text-align:left}
.post video,.post img{width:100%;max-height:500px;display:block}
.side{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:2}
.side button{background:rgba(0,0,0,0.6);color:#fff;border:2px solid #fff;width:52px;height:52px;border-radius:50%;font-size:22px;padding:0}
.side span{font-size:13px;font-weight:bold;text-shadow:1px 1px 2px #000}
.cap{padding:10px}
.cmt{padding:0 10px 12px}
.cmt input{width:70%;padding:8px}
.cmt button{width:25%;padding:8px}
</style>
</head>
<body>
<h1>PiGram Bharat 🛡️ AI SAFE • 100% FREE</h1>
<p>Family-Safe Short Video App - Bharat साठी</p>
<div class="box">
<h2>➕ Real Video Post करा!</h2>
<div class="safe">🛡️ AI SAFE ON - अश्लील Video / Photo Auto Delete होईल!</div><br>
<input type="file" id="fileInput" accept="video/*,image/*">
<input type="text" id="caption" placeholder="Caption - उदा. Telhara, Akola">
<button onclick="postVideo()">🚀 Post Video - सगळ्यांना दिसेल!</button>
<p id="msg"></p>
</div>
<div id="feed"><p>Loading...</p></div>
<script>
const SUPABASE_URL = "https://kjmrpivccmxdjcncliak.supabase.co"
const SUPABASE_KEY = "YOUR_ANON_KEY";sb_publishable_tqJHShYcb0adIEcOcrdHvw_1d5bhXqW
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let likes = {};
async function postVideo(){
  let file=document.getElementById("fileInput").files[0];
  let cap=document.getElementById("caption").value || "PiGram Bharat - Family Safe";
  if(!file){document.getElementById("msg").innerText="आधी Video / Photo निवडा!";return;}
  document.getElementById("msg").innerText="Upload होतंय... थांबा...";
  let fileName=Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9.]/g,"");
  let {error:upErr}=await supabase.storage.from("videos").upload(fileName,file);
  if(upErr){document.getElementById("msg").innerText="Upload Error: "+upErr.message;return;}
  let {data:pub}=supabase.storage.from("videos").getPublicUrl(fileName);
  let {error}=await supabase.from("posts").insert([{caption:cap,image_url:pub.publicUrl,media_type:file.type}]);
  if(error){document.getElementById("msg").innerText="Save Error: "+error.message;return;}
  document.getElementById("msg").innerText="✅ Post झाला! आता सगळ्यांना दिसेल!";
  document.getElementById("caption").value=""; loadPosts();
}
async function loadPosts(){
  let {data,error}=await supabase.from("posts").select("*").order("id",{ascending:false}).limit(50);
  let feed=document.getElementById("feed");
  if(error){feed.innerHTML="Error: "+error.message;return;}
  if(!data||data.length==0){feed.innerHTML="<p>अजून Post नाही - पहिला Post तुम्ही करा!</p>";return;}
  feed.innerHTML="";
  data.forEach(p=>{
    if(!likes[p.id]) likes[p.id]=9;
    let div=document.createElement("div"); div.className="post";
    let media=p.media_type&&p.media_type.startsWith("video/")?`<video src="${p.image_url}" controls playsinline loop></video>`:`<img src="${p.image_url}">`;
    div.innerHTML=media+`
    <div class="side">
      <button onclick="likePost(${p.id},this)">❤️</button><span id="like-${p.id}">${likes[p.id]}</span>
      <button onclick="commentPost(${p.id})">💬</button><span>Comment</span>
      <button onclick="sharePost('${p.image_url}')">🔁</button><span>Share</span>
      <button onclick="sharePost('${p.image_url}')">✈️</button><span>Send</span>
    </div>
    <div class="cap"><b>${p.caption}</b><br>PiGram Bharat • AI SAFE</div>
    <div class="cmt" id="cmt-${p.id}"></div>`;
    feed.appendChild(div);
  });
}
function likePost(id,btn){
  likes[id]++; document.getElementById("like-"+id).innerText=likes[id];
  btn.style.background="#ff0000"; btn.style.transform="scale(1.2)";
  setTimeout(()=>btn.style.transform="scale(1)",200);
}
function commentPost(id){
  let box=document.getElementById("cmt-"+id);
  box.innerHTML=`<input id="in-${id}" placeholder="Comment लिहा..."><button onclick="sendCmt(${id})">Post</button><div id="list-${id}"></div>`;
}
function sendCmt(id){
  let v=document.getElementById("in-"+id).value;
  if(!v) return;
  let l=document.getElementById("list-"+id);
  l.innerHTML+=`<p>👤 तुम्ही: ${v}</p>`;
  document.getElementById("in-"+id).value="";
}
function sharePost(url){
  if(navigator.share){ navigator.share({title:"PiGram Bharat", text:"PiGram वर हा Video बघ!", url:location.href}); }
  else{ navigator.clipboard.writeText(location.href); alert("Link Copy झाली! WhatsApp वर पाठव!"); }
}
loadPosts();
</script>
</body>
</html>
