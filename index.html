<style>
*{box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:0}
header{position:sticky;top:0;background:#111;padding:12px;text-align:center;border-bottom:1px solid #222;z-index:10}
header b{font-size:22px}header b span{color:#ffd700}.badge{background:#0a7a42;font-size:11px;padding:4px 8px;border-radius:20px}

.up{background:#1a0033;border:1px dashed #a06bff;border-radius:16px;padding:12px;text-align:center}

.cm{padding:0 12px 12px;font-size:13px;color:#ccc}.cin{display:flex;gap:6px;padding:0 12px 12px}.cin input{flex:1;padding:9px;border-radius:10px;border:0;background:#222;color:#fff}.cin button{background:#7b2ff7;color:#fff;border:0;padding:9px 12px;border-radius:10px;font-weight:700}
</style></head><body>
<header><b>PiGram <span>Bharat</span></b> <span class="badge">🛡️ AI SAFE • 100% FREE</span></header>
<div class="feed" id="feed">
<div class="up"><b>➕ Real Video Post करा!</b><br><small>Video निवडा + Caption लिहा</small><input id="file" type="file" accept="video/*"><input id="cap" placeholder="Caption - उदा. Telhara, Akola - माझं दुकान"><button onclick="addV()">🚀 Post Video</button><p id="msg" style="color:#8affb0;font-size:12px"></p></div>
</div>
<script>
let demos=[
{user:"@pramodjumble98",cap:"आयुष्यात जर सगळं मिळत गेलं असतं तर कमवायची किंमत कधीच कळली नसती ❤️ #Telhara #Akola",src:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",likes:189},
{user:"@samarth_agri",cap:"Akola Edu Expo 14-15-16 Nov 2026 - Samarth Block Shikshan Setu - 100% FREE! 🎓 Join Pi Code: Pramodjumbale",src:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",likes:342},

];
let saved=JSON.parse(localStorage.getItem('pigram_c')||'{}');
function render(){let f=document.getElementById('feed');f.querySelectorAll('.card').forEach(e=>e.remove());
demos.forEach((v,i)=>{let c=document.createElement('div');c.className='card';let cm=saved[i]||["@pramodjumble98: खूप छान भाऊ! 🙏"];
c.innerHTML=`<video controls playsinline preload="metadata" src="${v.src}"></video><div class="info"><div class="user">${v.user} <span style="color:#2aff8a;font-size:11px">✅ AI Verified</span></div><div class="cap">${v.cap}</div><div class="row"><button class="btn like" onclick="like(this)">❤️ Like <span>${v.likes}</span></button><button class="btn cmt" onclick="document.getElementById('in${i}').focus()">💬 Comment</button><button class="btn share" onclick="share('${v.user}')">↗️ Share</button></div></div><div class="cm">${cm.map(x=>`<div>${x}</div>`).join('')}</div><div class="cin"><input id="in${i}" placeholder="Comment लिहा..."><button onclick="addC(${i})">Post</button></div>`;f.appendChild(c);});}
function like(b){let s=b.querySelector('span');let n=parseInt(s.textContent);if(b.classList.contains('on')){b.classList.remove('on');s.textContent=n-1}else{b.classList.add('on');s.textContent=n+1}}
function addC(i){let inp=document.getElementById('in'+i);if(!inp.value.trim())return;let a=saved[i]||["@pramodjumble98: खूप छान भाऊ! 🙏"];a.push("@tumhi: "+inp.value);saved[i]=a;localStorage.setItem('pigram_c',JSON.stringify(saved));inp.value='';render()}
function share(u){let t=`PiGram Bharat वर ${u} चा Video बघा! https://pigram-bharat.vercel.app`;if(navigator.share){navigator.share({text:t})}else{navigator.clipboard.writeText(t);alert('Link Copy झाली! WhatsApp ला Paste करा!')}}
function addV(){let f=document.getElementById('file').files[0];if(!f){document.getElementById('msg').innerText='आधी Video निवडा!';return}let url=URL.createObjectURL(f);let cap=document.getElementById('cap').value||'माझा नवीन Video - Telhara, Akola';demos.unshift({user:"@tumhi",cap:cap,src:url,likes:0});render();document.getElementById('msg').innerText='✅ Video Post झाला! वरती Feed मध्ये बघा!';window.scrollTo({top:0,behavior:'smooth'})}
